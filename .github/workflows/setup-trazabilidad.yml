name: Setup trazabilidad (labels + issues)

# Ejecutar UNA sola vez, manualmente, después del primer push.
# Crea las etiquetas de estado/requisito y los Issues en el orden de traceability/issues.json,
# de modo que el Issue #N quede vinculado al escenario Karate con el tag @Issue-N.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear labels e issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const catalogo = JSON.parse(fs.readFileSync('traceability/issues.json', 'utf8'));

            // 1. Labels de estado (las actualiza ci.yml) y de requisito
            const labels = [
              { name: 'status:passed', color: '0e8a16', description: 'Último resultado de la automatización: aprobado' },
              { name: 'status:failed', color: 'd73a4a', description: 'Último resultado de la automatización: fallido' },
              { name: 'bug',           color: 'b60205', description: 'Defecto detectado por la automatización' },
              { name: 'karate',        color: '1d76db', description: 'Caso de prueba automatizado con Karate' },
              { name: 'smoke',         color: 'fbca04', description: 'Prueba de humo' },
              { name: 'positivo',      color: 'c2e0c6', description: 'Escenario positivo' },
              { name: 'negativo',      color: 'f9d0c4', description: 'Escenario negativo' },
              ...Object.entries(catalogo.requisitos).map(([req, desc]) => ({ name: req, color: '5319e7', description: desc.substring(0, 100) }))
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`Label creado: ${l.name}`);
              } catch (e) {
                await github.rest.issues.updateLabel({ ...context.repo, name: l.name, color: l.color, description: l.description });
              }
            }

            // 2. Issues existentes (para no duplicar si el workflow se ejecuta de nuevo)
            const existentes = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'all', per_page: 100 });
            const porTitulo = new Map(existentes.filter(i => !i.pull_request).map(i => [i.title, i.number]));

            // Extrae del .feature el bloque Gherkin del escenario con el tag @Issue-N
            const extraerEscenario = (feature, n) => {
              const lineas = fs.readFileSync(feature, 'utf8').split(/\r?\n/);
              const inicio = lineas.findIndex(l => new RegExp(`@Issue-${n}(\\s|$)`).test(l));
              if (inicio < 0) return '(escenario no encontrado)';
              let fin = inicio + 1;
              while (fin < lineas.length && !/^\s*@/.test(lineas[fin]) && !/^\s*# -{10,}/.test(lineas[fin])) fin++;
              return lineas.slice(inicio, fin).join('\n').replace(/\s+$/, '');
            };

            // 3. Crear los issues en orden
            for (const it of catalogo.issues) {
              if (porTitulo.has(it.titulo)) {
                core.info(`Ya existe #${porTitulo.get(it.titulo)}: ${it.titulo}`);
                continue;
              }
              const body = [
                '## Trazabilidad de Automatización',
                '',
                `- **Tag Karate:** \`@Issue-${it.numero}\``,
                `- **Requisito:** \`@${it.requisito}\` - ${catalogo.requisitos[it.requisito]}`,
                `- **Archivo Feature:** \`${it.feature}\``,
                `- **Tipo de escenario:** ${it.tipo}`,
                '',
                '### Escenario Gherkin',
                '```gherkin',
                extraerEscenario(it.feature, it.numero),
                '```',
                '',
                '### Ejecución',
                `Actions → **CI / CD Pipeline** → *Run workflow* → tag \`@Issue-${it.numero}\``
              ].join('\n');

              const { data } = await github.rest.issues.create({
                ...context.repo,
                title: it.titulo,
                body,
                labels: ['karate', it.tipo, it.requisito]
              });
              if (data.number !== it.numero) {
                core.warning(`El issue "${it.titulo}" quedó con el número #${data.number} y no #${it.numero}: actualice el tag @Issue-${it.numero} en ${it.feature}`);
              } else {
                core.info(`Creado #${data.number}: ${it.titulo}`);
              }
            }
